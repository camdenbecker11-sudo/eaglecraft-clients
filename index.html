<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EagleCraft Clients Launcher</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #111a2d;
        --panel-2: #18253f;
        --accent: #4ec9f5;
        --accent-2: #73f0b9;
        --text: #e5ebff;
        --muted: #9aa9c7;
        --danger: #ff6b6b;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, var(--bg) 0%, #111827 100%);
        color: var(--text);
      }

      .app {
        width: min(1600px, 96vw);
        margin: 20px auto;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 18px 20px;
        background: rgba(17, 26, 45, 0.9);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 12px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.2);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.4rem, 2vw, 2.2rem);
      }

      .badge {
        background: rgba(78, 201, 245, 0.12);
        border: 1px solid rgba(78, 201, 245, 0.5);
        color: var(--accent);
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 0.85rem;
        white-space: nowrap;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(260px, 350px) minmax(0, 1fr);
        gap: 18px;
        margin-top: 18px;
      }

      .sidebar,
      .viewer {
        background: rgba(17, 26, 45, 0.9);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 14px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.18);
      }

      .sidebar {
        padding: 16px;
      }

      .sidebar h2 {
        margin: 0 0 12px;
        font-size: 1.15rem;
      }

      .client-list {
        display: grid;
        gap: 10px;
      }

      .client-btn {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.08);
        background: linear-gradient(180deg, var(--panel-2), #101a2b);
        color: var(--text);
        text-align: left;
        font-size: 0.98rem;
        cursor: pointer;
        transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      }

      .client-btn:hover {
        transform: translateY(-1px);
        border-color: rgba(78, 201, 245, 0.8);
        box-shadow: 0 8px 18px rgba(78, 201, 245, 0.15);
      }

      .client-btn.active {
        background: linear-gradient(180deg, rgba(78, 201, 245, 0.18), rgba(78, 201, 245, 0.08));
        border-color: rgba(78, 201, 245, 0.9);
      }

      .viewer {
        padding: 12px;
      }

      .viewer-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 8px 10px 12px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }

      .viewer-title {
        font-weight: bold;
        font-size: 1.05rem;
      }

      .open-link {
        text-decoration: none;
        color: var(--accent-2);
        border: 1px solid rgba(115, 240, 185, 0.5);
        background: rgba(115, 240, 185, 0.08);
        padding: 8px 12px;
        border-radius: 8px;
      }

      .frame-wrap {
        position: relative;
        width: 100%;
        height: calc(100vh - 220px);
        min-height: 620px;
        margin-top: 12px;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.08);
        background: #070d18;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }

      .note {
        margin-top: 10px;
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.5;
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .frame-wrap {
          min-height: 500px;
          height: 65vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <h1>EagleCraft Clients</h1>
        <div class="badge">Launcher</div>
      </div>

      <div class="layout">
        <aside class="sidebar">
          <h2>Available clients</h2>
          <div class="client-list" id="clientList"></div>
        </aside>

        <main class="viewer">
          <div class="viewer-header">
            <div class="viewer-title" id="activeTitle">Loading...</div>
            <a id="openInNewTab" class="open-link" href="#" target="_blank" rel="noopener noreferrer">Open in new tab</a>
          </div>

          <div class="frame-wrap">
            <iframe id="clientFrame" title="Selected client"></iframe>
          </div>
          <div class="note">Files over 25 MB are excluded from this launcher to keep it within the requested size limit.</div>
        </main>
      </div>
    </div>

    <script>
      const clients = [
        { name: '1.8', file: '1.8.html' },
        { name: 'Astra Client', file: 'Astra Client.html' },
        { name: 'Kerosene Client', file: 'Kerosene Client.html' },
        { name: 'Kerosene', file: 'Kerosene.html' },
        { name: 'N0VA CLIENT', file: 'N0VA CLIENT.html' },
        { name: 'Nebula Client (Maybe Ratted)', file: 'Nebula Client (Maybe Ratted).html' },
        { name: 'NitClient 2.0', file: 'NitClient 2.0.html' },
        { name: 'OddFuture Client', file: 'OddFuture Client.html' },
        { name: 'Resent PvP Client (Press K for Menu)', file: 'Resent PvP Client (Press K for Menu).html' }
      ];

      const clientList = document.getElementById('clientList');
      const frame = document.getElementById('clientFrame');
      const activeTitle = document.getElementById('activeTitle');
      const openLink = document.getElementById('openInNewTab');

      function setClient(file, name) {
        activeTitle.textContent = name;
        frame.src = file;
        openLink.href = file;

        document.querySelectorAll('.client-btn').forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.file === file);
        });
      }

      clients.forEach((client, index) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'client-btn';
        btn.dataset.file = client.file;
        btn.textContent = client.name;
        btn.addEventListener('click', () => setClient(client.file, client.name));
        clientList.appendChild(btn);

        if (index === 0) {
          setClient(client.file, client.name);
        }
      });
    </script>
  </body>
</html>
