<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EagleCraft Clients Launcher</title>
    <style>
      :root {
        --bg: #0b1020;
        --panel: #111a2d;
        --panel-2: #18253f;
        --accent: #4ec9f5;
        --accent-2: #73f0b9;
        --text: #e5ebff;
        --muted: #9aa9c7;
        --danger: #ff6b6b;
        --warning: #ffb454;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, var(--bg) 0%, #111827 100%);
        color: var(--text);
      }

      .app {
        width: min(1600px, 96vw);
        margin: 20px auto;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 18px 20px;
        background: rgba(17, 26, 45, 0.9);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 12px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.2);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.4rem, 2vw, 2.2rem);
      }

      .badge {
        background: rgba(78, 201, 245, 0.12);
        border: 1px solid rgba(78, 201, 245, 0.5);
        color: var(--accent);
        padding: 8px 12px;
        border-radius: 999px;
        font-size: 0.85rem;
        white-space: nowrap;
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(260px, 350px) minmax(0, 1fr);
        gap: 18px;
        margin-top: 18px;
      }

      .sidebar,
      .viewer {
        background: rgba(17, 26, 45, 0.9);
        border: 1px solid rgba(255,255,255,0.08);
        border-radius: 14px;
        box-shadow: 0 12px 30px rgba(0,0,0,0.18);
      }

      .sidebar {
        padding: 16px;
      }

      .sidebar h2 {
        margin: 0 0 12px;
        font-size: 1.15rem;
      }

      .client-list {
        display: grid;
        gap: 10px;
      }

      .client-btn {
        width: 100%;
        padding: 12px 14px;
        border-radius: 10px;
        border: 1px solid rgba(255,255,255,0.08);
        background: linear-gradient(180deg, var(--panel-2), #101a2b);
        color: var(--text);
        text-align: left;
        font-size: 0.98rem;
        cursor: pointer;
        transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
      }

      .client-btn:hover:not(:disabled) {
        transform: translateY(-1px);
        border-color: rgba(78, 201, 245, 0.8);
        box-shadow: 0 8px 18px rgba(78, 201, 245, 0.15);
      }

      .client-btn.active {
        background: linear-gradient(180deg, rgba(78, 201, 245, 0.18), rgba(78, 201, 245, 0.08));
        border-color: rgba(78, 201, 245, 0.9);
      }

      .client-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        border-color: rgba(255,180,84,0.4);
      }

      .client-meta {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-top: 6px;
        font-size: 0.75rem;
        color: var(--muted);
      }

      .size-badge {
        border-radius: 999px;
        padding: 3px 7px;
        font-size: 0.68rem;
        border: 1px solid rgba(255,255,255,0.08);
      }

      .size-badge.large {
        color: var(--warning);
        border-color: rgba(255,180,84,0.4);
      }

      .viewer {
        padding: 12px;
      }

      .viewer-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        padding: 8px 10px 12px;
        border-bottom: 1px solid rgba(255,255,255,0.08);
      }

      .viewer-title {
        font-weight: bold;
        font-size: 1.05rem;
      }

      .open-link {
        text-decoration: none;
        color: var(--accent-2);
        border: 1px solid rgba(115, 240, 185, 0.5);
        background: rgba(115, 240, 185, 0.08);
        padding: 8px 12px;
        border-radius: 8px;
      }

      .frame-wrap {
        position: relative;
        width: 100%;
        height: calc(100vh - 220px);
        min-height: 620px;
        margin-top: 12px;
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid rgba(255,255,255,0.08);
        background: #070d18;
      }

      iframe {
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }

      .note {
        margin-top: 10px;
        color: var(--muted);
        font-size: 0.82rem;
        line-height: 1.5;
      }

      @media (max-width: 900px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .frame-wrap {
          min-height: 500px;
          height: 65vh;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="topbar">
        <h1>EagleCraft Clients</h1>
        <div class="badge">Launcher</div>
      </div>

      <div class="layout">
        <aside class="sidebar">
          <h2>Available clients</h2>
          <div class="client-list" id="clientList"></div>
        </aside>

        <main class="viewer">
          <div class="viewer-header">
            <div class="viewer-title" id="activeTitle">Loading...</div>
            <a id="openInNewTab" class="open-link" href="#" target="_blank" rel="noopener noreferrer">Open in new tab</a>
          </div>

          <div class="frame-wrap">
            <iframe id="clientFrame" title="Selected client"></iframe>
          </div>
          <div class="note">This launcher includes all client HTML files in the repo. Files over 25 MB are marked as large and may not load reliably in-browser.</div>
        </main>
      </div>
    </div>

    <script>
      const clients = [
        { name: '1.8', file: '1.8.html', sizeMb: 17.4 },
        { name: 'Astra Client', file: 'Astra Client.html', sizeMb: 0.001 },
        { name: 'EaglerForge 1.2.5 1.8 Offline International', file: 'EaglerForge_1.2.5_1.8_Offline_International (1).html', sizeMb: 24.0 },
        { name: 'Kerosene Client', file: 'Kerosene Client.html', sizeMb: 19.9 },
        { name: 'Kerosene', file: 'Kerosene.html', sizeMb: 19.9 },
        { name: 'N0VA CLIENT', file: 'N0VA CLIENT.html', sizeMb: 16.1 },
        { name: 'Nebula Client (Maybe Ratted)', file: 'Nebula Client (Maybe Ratted).html', sizeMb: 12.2 },
        { name: 'NitClient 2.0', file: 'NitClient 2.0.html', sizeMb: 19.1 },
        { name: 'OddFuture Client', file: 'OddFuture Client.html', sizeMb: 10.8 },
        { name: 'Resent PvP Client (Press K for Menu)', file: 'Resent PvP Client (Press K for Menu).html', sizeMb: 20.1 }
      ];

      const MAX_SIZE_MB = 25;
      const clientList = document.getElementById('clientList');
      const frame = document.getElementById('clientFrame');
      const activeTitle = document.getElementById('activeTitle');
      const openLink = document.getElementById('openInNewTab');

      function formatSize(sizeMb) {
        if (sizeMb >= 1) return `${sizeMb.toFixed(1)} MB`;
        return `${(sizeMb * 1000).toFixed(0)} KB`;
      }

      function setClient(file, name, isLarge) {
        activeTitle.textContent = name + (isLarge ? ' (Large file)' : '');
        if (isLarge) {
          frame.src = 'about:blank';
          openLink.href = file;
          alert('This client is larger than 25 MB and may not load properly in-browser. It is still available via the Open in new tab link.');
        } else {
          frame.src = file;
          openLink.href = file;
        }

        document.querySelectorAll('.client-btn').forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.file === file);
        });
      }

      clients.forEach((client) => {
        const btn = document.createElement('button');
        const isLarge = client.sizeMb > MAX_SIZE_MB;

        btn.type = 'button';
        btn.className = 'client-btn';
        btn.dataset.file = client.file;
        btn.disabled = isLarge;
        btn.innerHTML = `
          <div>${client.name}</div>
          <div class="client-meta">
            <span>${isLarge ? 'Large file' : 'Ready to load'}</span>
            <span class="size-badge ${isLarge ? 'large' : ''}">${formatSize(client.sizeMb)}</span>
          </div>
        `;

        btn.addEventListener('click', () => {
          if (isLarge) {
            setClient(client.file, client.name, true);
            return;
          }
          setClient(client.file, client.name, false);
        });

        clientList.appendChild(btn);
      });

      const first = clients[0];
      setClient(first.file, first.name, first.sizeMb > MAX_SIZE_MB);
    </script>
  </body>
</html>
